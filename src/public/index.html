<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAS::PORTS — 容器端口监控台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Major+Mono+Display&display=swap" rel="stylesheet">
  <script>
    // 首次默认亮色(高亮)主题；选择记忆于 localStorage
    (function () {
      var t;
      try { t = localStorage.getItem('npv-theme'); } catch (_) {}
      if (t !== 'light' && t !== 'dark') t = 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- CRT 氛围层 -->
  <div class="crt-scanlines" aria-hidden="true"></div>
  <div class="crt-grain" aria-hidden="true"></div>
  <div class="crt-vignette" aria-hidden="true"></div>

  <div class="console">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◆</span>
        <h1 class="brand-title">nas<span class="dim">::</span>ports</h1>
        <span class="cursor" aria-hidden="true">▌</span>
      </div>
      <div class="topbar-meta">
        <div class="readout">
          <span class="readout-label">node</span>
          <span class="readout-value" id="hostIp">—.—.—.—</span>
        </div>
        <button id="themeToggle" class="btn-theme" type="button" title="切换主题" aria-label="切换主题">
          <span class="theme-glyph" aria-hidden="true">☾</span>
        </button>
        <button id="refresh" class="btn-refresh" type="button" title="重新扫描">
          <span class="btn-glyph" aria-hidden="true">↻</span> 重新扫描
        </button>
        <label class="toggle" title="自动刷新 (5s)">
          <input type="checkbox" id="auto">
          <span class="toggle-track"><span class="toggle-led"></span></span>
          <span class="toggle-label">自动刷新</span>
        </label>
      </div>
    </header>

    <div class="status-strip">
      <span class="strip-item"><span class="led" id="signalLed"></span><span id="signalText" role="status">正在连接</span></span>
      <span class="strip-item" id="countReadout">应用: —</span>
      <span class="strip-item" id="updatedReadout">上次更新: —</span>
      <span class="strip-spacer"></span>
      <span class="strip-item dim">docker · procfs · lan</span>
    </div>
    <p id="notice" class="notice" role="status">正在读取容器与端口…</p>

    <main class="grid-wrap">
      <div class="grid-bg" aria-hidden="true"></div>
      <div class="scan-line" aria-hidden="true"></div>
      <div class="table-scroll">
        <table class="ports-table" role="table" aria-label="NAS 应用与端口">
          <colgroup>
            <col class="width-svc"><col class="width-ip"><col class="width-st"><col class="width-net"><col class="width-ports">
          </colgroup>
          <thead>
            <tr>
              <th scope="col" id="heading-svc" class="col-svc">应用名称</th>
              <th scope="col" id="heading-ip" class="col-ip">IP 地址</th>
              <th scope="col" id="heading-st" class="col-st">运行状态</th>
              <th scope="col" id="heading-net" class="col-net">网络模式</th>
              <th scope="col" id="heading-ports" class="col-ports">端口</th>
            </tr>
          </thead>
          <tbody id="tbody" role="rowgroup"></tbody>
        </table>
        <div id="empty" class="empty" hidden>
          <span class="empty-mark" aria-hidden="true">∅</span>
          <span>此节点暂无 Docker 容器</span>
        </div>
      </div>
    </main>
    <p class="port-legend">端口说明：宿主监听 · 宿主端口 → 容器端口 · 内部端口不占用 NAS 端口。点击应用名称查看完整信息。</p>

    <footer class="footbar">
      <span>nas-ports-view</span>
      <span class="foot-dim">read-only monitor · v1</span>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
